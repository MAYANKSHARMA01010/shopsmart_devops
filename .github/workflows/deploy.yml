name: Production Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Verify Client
        run: pnpm --filter shopsmart-frontend build

      # Add Vercel deployment action / CLI when VERCEL_TOKEN is configured:
      # - name: Deploy to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: '--prod'

  deploy-backend:
    name: Deploy Backend (Render / Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Verify Server
        run: pnpm --filter shopsmart-server build

      # Add Render Deploy Hook when RENDER_DEPLOY_HOOK is configured:
      # - name: Trigger Render Deploy Hook
      #   if: env.RENDER_DEPLOY_HOOK != ''
      #   run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
